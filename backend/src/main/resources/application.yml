server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: ai-sports-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/ai_sports?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:ai_sports}
    password: ${SPRING_DATASOURCE_PASSWORD:ai_sports_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:change-me-to-a-256-bit-secret-for-local-dev-only}
    jwt-expiration-seconds: ${APP_SECURITY_JWT_EXPIRATION_SECONDS:86400}
  ai:
    base-url: ${APP_AI_BASE_URL:http://localhost:8000}
    internal-token: ${APP_AI_INTERNAL_TOKEN:local-internal-ai-token}
